[project]
name = "wedding-planner"
version = "0.1.0"
description = "A research-backed wedding planner with LangChain, Groq, Tavily and Streamlit"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.3.2,<2",
    "langchain-openai>=1.2.2,<2",
    "streamlit>=1.57,<2",
    "tavily-python>=0.7,<1",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
